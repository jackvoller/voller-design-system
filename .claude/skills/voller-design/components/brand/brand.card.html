<!-- @dsCard group="Components" viewport="700x260" name="Brand" subtitle="Wordmark, AppTile, GlassAvatar" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .grid { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="../../assets/ds-resolve.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { Wordmark, AppTile, GlassAvatar } = window.__DS;

function Demo() {
  return (
    <div className="grid">
      <div className="row" style={{ gap: 28, alignItems: 'flex-end' }}>
        <Wordmark as="div" size={40} />
        <Wordmark as="div" size={22} />
        <div style={{ padding: '12px 16px', borderRadius: 12, background: 'var(--ink)' }}>
          <Wordmark as="div" size={22} onDark />
        </div>
      </div>
      <div className="row" style={{ gap: 14 }}>
        {['voller', 'unpickle', 'mealplanner', 'unjumble', 'riverly'].map((a) => (
          <AppTile key={a} app={a} size={64} assetPath="../../assets/app-icons" />
        ))}
        <AppTile app="voller" variant="tinted" size={64} assetPath="../../assets/app-icons" />
      </div>
      <div className="row" style={{ gap: 16, padding: 14, borderRadius: 16, background: 'var(--field-light)' }}>
        <GlassAvatar size={72}>V</GlassAvatar>
        <GlassAvatar size={56}>UP</GlassAvatar>
        <div style={{ display: 'flex', gap: 16, padding: 12, borderRadius: 12, background: 'var(--ink)' }}>
          <GlassAvatar size={56} onDark>R</GlassAvatar>
        </div>
        <span className="lbl">glass ring at r + 7%</span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
