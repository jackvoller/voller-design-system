<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:18px">
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/app-icons/voller.png" width="84" height="84" alt="Voller" style="border-radius:23.5%;display:block"><span class="hex">Voller</span></div><div class="col" style="gap:8px;align-items:center"><img src="../assets/app-icons/unpickle.png" width="84" height="84" alt="UnPickle" style="border-radius:23.5%;display:block"><span class="hex">UnPickle</span></div><div class="col" style="gap:8px;align-items:center"><img src="../assets/app-icons/mealplanner.png" width="84" height="84" alt="Meal Planner" style="border-radius:23.5%;display:block"><span class="hex">Meal Planner</span></div><div class="col" style="gap:8px;align-items:center"><img src="../assets/app-icons/unjumble.png" width="84" height="84" alt="UnJumble" style="border-radius:23.5%;display:block"><span class="hex">UnJumble</span></div><div class="col" style="gap:8px;align-items:center"><img src="../assets/app-icons/riverly.png" width="84" height="84" alt="Riverly" style="border-radius:23.5%;display:block"><span class="hex">Riverly</span></div>
</div>
</body>
</html>
