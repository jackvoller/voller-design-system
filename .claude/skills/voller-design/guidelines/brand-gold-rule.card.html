<!-- @dsCard group="Brand" viewport="700x190" name="The gold rule" subtitle="One gold per view. In a header, that one is the wordmark tile." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:16px;align-items:stretch">
  <div style="flex:1;padding:14px;border:1px solid var(--hairline);border-radius:16px;background:var(--white);display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:.9"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--gold);flex:none"></i></span>
      <span style="padding:7px 13px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--hairline-strong);color:var(--green-dark);font-size:13px;font-weight:500">Apps</span>
    </div>
    <span style="font-size:12px;color:var(--green-dark);font-weight:500">✓ one gold — the tile</span>
  </div>
  <div style="flex:1;padding:14px;border:1px solid var(--hairline);border-radius:16px;background:var(--white);display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:.9"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--gold);flex:none"></i></span>
      <span style="padding:7px 13px;border-radius:10px;background:var(--gold);color:var(--green-dark);font-size:13px;font-weight:600">Download</span>
    </div>
    <span style="font-size:12px;color:var(--muted);font-weight:500">✕ two golds — make one green-dark</span>
  </div>
</div>
</body>
</html>
