<!-- @dsCard group="Brand" viewport="700x180" name="Icon & favicon" subtitle="Below 32px the gold tile turns to mud — the favicon is a documented simplification." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:24px;align-items:flex-end">
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/voller-icon.svg" width="104" height="104" alt="Voller icon" style="border-radius:23.5%;display:block"><span class="hex">voller-icon.svg · ≥33px</span></div>
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/favicon.svg" width="64" height="64" alt="Voller favicon" style="border-radius:23.5%;display:block"><span class="hex">favicon.svg · ≤32px</span></div>
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/favicon-32.png" width="32" height="32" alt="32px favicon" style="display:block"><span class="hex">32</span></div>
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/favicon-16.png" width="16" height="16" alt="16px favicon" style="display:block"><span class="hex">16</span></div>
  <p style="flex:1;min-width:180px;font-size:12px;color:var(--muted)">Full icon: glass ring, green disc, cream V on the 35° axis, one gold tile resting in the V. Never circular as a tile, never shadowed.</p>
</div>
</body>
</html>
