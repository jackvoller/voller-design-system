<!-- @dsCard group="Brand" viewport="700x190" name="The ration rule" subtitle="One rationed element per view. In a header, that one is the wordmark tile." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="row" style="gap:16px;align-items:stretch">
  <div style="flex:1;padding:14px;border:1px solid var(--hairline);border-radius:16px;background:var(--white);display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:.9"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--yellow);flex:none"></i></span>
      <span style="padding:7px 13px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--hairline-strong);color:var(--yellow-dark);font-size:13px;font-weight:500">Apps</span>
    </div>
    <span style="font-size:12px;color:var(--yellow-dark);font-weight:500">&#10003; one yellow &mdash; the tile</span>
  </div>
  <div style="flex:1;padding:14px;border:1px solid var(--hairline);border-radius:16px;background:var(--white);display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:.9"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--yellow);flex:none"></i></span>
      <span style="padding:7px 13px;border-radius:10px;background:var(--yellow);color:var(--ink);font-size:13px;font-weight:600">Download</span>
    </div>
    <span style="font-size:12px;color:var(--muted);font-weight:500">&#10007; two yellows &mdash; step one down to yellow-dark</span>
  </div>
</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--muted)">Inside an <em>app icon</em> the ration is spent in that app&rsquo;s own accent, not in yellow. Neither the field nor <code>yellow-wash</code> spends it.</p>
</body>
</html>
