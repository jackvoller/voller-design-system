<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark sizes" subtitle="Tile = .33 × cap height, gap = .2, radius 23.5%. Geometry scales with size." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:36px;align-items:flex-end">
  <div class="col" style="gap:8px">
    <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:.9;color:var(--ink)"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--gold);flex:none"></i></span>
    <span class="hex">64px · hero</span>
  </div><div class="col" style="gap:8px">
    <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:.9;color:var(--ink)"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--gold);flex:none"></i></span>
    <span class="hex">32px · mid</span>
  </div><div class="col" style="gap:8px">
    <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:.9;color:var(--ink)"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--gold);flex:none"></i></span>
    <span class="hex">22px · header</span>
  </div>
  <div class="col" style="gap:8px;padding:12px 16px;border-radius:12px;background:var(--ink)">
    <span style="display:inline-flex;align-items:flex-end;gap:.2em;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:.9;color:var(--cream-dark)"><span>Voller</span><i style="width:.33em;height:.33em;border-radius:23.5%;background:var(--gold);flex:none"></i></span>
    <span class="hex" style="color:var(--text-secondary-on-dark)">on dark</span>
  </div>
</div>
</body>
</html>
