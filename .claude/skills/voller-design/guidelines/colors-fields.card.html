<!-- @dsCard group="Colors" viewport="700x170" name="Fields & gloss" subtitle="The only two gradients in the system. Any third is wrong." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:12px;align-items:stretch">
  <div class="sw" style="flex:1"><div class="chip" style="height:78px;background:var(--field-light)"></div><span class="tok">--field-light</span><span class="hex">160deg #FFFDF5 → #FFF1CE</span></div>
  <div class="sw" style="flex:1"><div class="chip" style="height:78px;background:var(--field-dark)"></div><span class="tok">--field-dark</span><span class="hex">160deg #302F2C → #1B1B19</span></div>
  <div class="sw" style="flex:1">
    <div class="chip" style="height:78px;background:var(--yellow);position:relative;overflow:hidden">
      <span style="position:absolute;inset:0;background:var(--gloss)"></span>
    </div>
    <span class="tok">--gloss</span><span class="hex">above the field, under an ink subject</span>
  </div>
</div>
</body>
</html>
