<!-- @dsCard group="Colors" viewport="700x150" name="Gold — the action colour" subtitle="Exactly one gold element per view. Not a warning, not a highlight." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:16px">
  <div class="sw" style="width:200px"><div class="chip" style="background:var(--gold)"></div><span class="tok">--gold</span><span class="hex">#F0C21C</span></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:22px;height:22px;border-radius:23.5%;background:var(--gold);flex:none"></span>
      <span style="font-size:13px">the wordmark tile — the header's one gold</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="padding:8px 14px;border-radius:var(--radius-control);background:var(--gold);color:var(--green-dark);font-size:14px;font-weight:600">Download</span>
      <span style="font-size:13px;color:var(--muted)">…or the primary action. Never both.</span>
    </div>
  </div>
</div>
</body>
</html>
