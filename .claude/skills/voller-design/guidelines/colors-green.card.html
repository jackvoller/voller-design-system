<!-- @dsCard group="Colors" viewport="700x150" name="Green ramp" subtitle="The brand. Flat fills only — green is never a gradient." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:12px">
  <div class="sw" style="flex:1"><div class="chip" style="background:var(--green)"></div><span class="tok">--green</span><span class="hex">#82BA51 · primary fills, buttons</span></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:var(--green-deep)"></div><span class="tok">--green-deep</span><span class="hex">#69A63C · detail on green only</span></div>
  <div class="sw" style="flex:1"><div class="chip" style="background:var(--green-dark)"></div><span class="tok">--green-dark</span><span class="hex">#3F6B27 · links, hover, on gold</span></div>
</div>
</body>
</html>
