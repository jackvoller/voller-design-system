<!-- @dsCard group="Colors" viewport="700x150" name="Yellow carries ink, never cream" subtitle="Cream on yellow is 1.4:1. This is the rule the whole palette turns on." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page); padding: 20px; }
    .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .btn { padding: 9px 16px; border-radius: var(--radius-control); font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
<div class="row">
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="btn" style="background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hairline)">Get Riverly</span>
    <span class="hex">✓ ink on yellow · 10.8:1</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="btn" style="background:var(--yellow);color:var(--cream)">Get Riverly</span>
    <span class="hex">✕ cream on yellow · 1.4:1</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="btn" style="background:var(--yellow-dark);color:var(--cream)">Pressed</span>
    <span class="hex">✓ cream on yellow-dark · 5.3:1</span>
  </div>
  <p style="flex:1;min-width:170px;font-size:12px;color:var(--muted);margin:0">The middle button sits on the pale yellow field with no hairline — the same 1.4:1 problem twice over. A yellow fill needs ink content or an edge.</p>
</div>
</body>
</html>
