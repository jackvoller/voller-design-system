<!-- @dsCard group="Spacing" viewport="700x170" name="Section rhythm" subtitle="Four steps between blocks: 24 / 32 / 56 / 72." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="col" style="gap:8px">
  <div style="display:flex;align-items:center;gap:12px"><div style="width:24px;height:8px;background:var(--yellow);border-radius:2px;flex:none"></div><span class="tok">--rhythm-tight</span><span class="hex">24px · within a group</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:32px;height:8px;background:var(--yellow);border-radius:2px;flex:none"></div><span class="tok">--rhythm-base</span><span class="hex">32px · between groups</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:56px;height:8px;background:var(--yellow);border-radius:2px;flex:none"></div><span class="tok">--rhythm-loose</span><span class="hex">56px · between blocks</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:72px;height:8px;background:var(--yellow);border-radius:2px;flex:none"></div><span class="tok">--rhythm-section</span><span class="hex">72px · between sections</span></div>
</div>
</body>
</html>
