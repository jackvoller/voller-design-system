<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px base. Use gap on a flex/grid parent — never margin-per-child." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:10px;align-items:flex-end">
  <div class="col" style="gap:4px;align-items:center"><div style="width:4px;height:4px;background:var(--green);border-radius:3px"></div><span class="hex">4</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:8px;height:8px;background:var(--green);border-radius:3px"></div><span class="hex">8</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:12px;height:12px;background:var(--green);border-radius:3px"></div><span class="hex">12</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:16px;height:16px;background:var(--green);border-radius:3px"></div><span class="hex">16</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:24px;height:24px;background:var(--green);border-radius:3px"></div><span class="hex">24</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:32px;height:32px;background:var(--green);border-radius:3px"></div><span class="hex">32</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:56px;height:56px;background:var(--green);border-radius:3px"></div><span class="hex">56</span></div><div class="col" style="gap:4px;align-items:center"><div style="width:72px;height:72px;background:var(--green);border-radius:3px"></div><span class="hex">72</span></div>
  <span class="hex" style="margin-left:8px">--space-1 … --space-8</span>
</div>
</body>
</html>
