<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }

    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }

<body>
<div class="col" style="gap:10px;max-width:var(--measure-prose)">
  <div style="display:flex;align-items:baseline;gap:14px">
    <span style="font-size:var(--fs-h2);font-weight:600;letter-spacing:-.02em">What we ship</span>
    <span class="hex">22 / 600 / -.02em</span>
  </div>
  <p style="font-size:var(--fs-body);line-height:1.6">Voller is the studio behind UnPickle, Meal Planner, UnJumble and Riverly. Small apps that do one thing, on the platform they were made for.</p>
