<!-- @dsCard group="Type" viewport="700x150" name="Display & H1" subtitle="System sans 600, -0.02em. One family — never pair two, and no webfont." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="col" style="gap:10px">
  <div style="display:flex;align-items:baseline;gap:14px">
    <span style="font-size:var(--fs-display);font-weight:600;letter-spacing:-.02em;line-height:1.1">Four apps, one hand.</span>
    <span class="hex">44 / 600 / -.02em</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:14px">
    <span style="font-size:var(--fs-h1);font-weight:600;letter-spacing:-.02em;line-height:1.2">Built by Voller</span>
    <span class="hex">34 / 600 / -.02em</span>
  </div>
</div>
</body>
</html>
