<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow / mono" subtitle="The only permitted monospace use: labels, specs, eyebrows. Never body copy." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="col" style="gap:12px">
  <div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">The family</div>
    <div style="font-size:var(--fs-h2);font-weight:600;letter-spacing:-.02em;margin-top:4px">Siblings, not a suite</div>
  </div>
  <span class="hex">11–12px · uppercase · .1em · --muted · sits above the heading, never below</span>
</div>
</body>
</html>
