<!-- @dsCard group="Type" viewport="700x150" name="Small & caption" subtitle="14px for UI labels and secondary copy; 12px for captions and metadata." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="col" style="gap:10px">
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:var(--fs-small)">Requires iOS 18 or later. Universal purchase.</span><span class="hex">14 / 400</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:var(--fs-caption);color:var(--muted)">Updated 14 August 2026 · version 2.1</span><span class="hex">12 / 400 / muted</span></div>
</div>
</body>
</html>
