<!-- @dsCard group="Type" viewport="700x150" name="Weights" subtitle="400 / 500 / 600 only. 700+ is unused in this brand." -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background: var(--bg-page-flat); padding: 20px; }
    .row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: var(--space-2); }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 56px; border-radius: 12px; border: 1px solid var(--hairline); }
    .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
    .tok { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }

  </style>
</head>
<body>
<div class="row" style="gap:28px">
  <div class="col" style="gap:2px"><span style="font-size:26px;font-weight:400">Voller</span><span class="hex">400 · body</span></div>
  <div class="col" style="gap:2px"><span style="font-size:26px;font-weight:500">Voller</span><span class="hex">500 · controls</span></div>
  <div class="col" style="gap:2px"><span style="font-size:26px;font-weight:600;letter-spacing:-.02em">Voller</span><span class="hex">600 · headings, wordmark</span></div>
  <div class="col" style="gap:2px;opacity:.35"><span style="font-size:26px;font-weight:700">Voller</span><span class="hex">700 · not used</span></div>
</div>
</body>
</html>
